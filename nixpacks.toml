# Force Nixpacks to use the Python provider on Railway.
# Without this, the root-level package.json makes Railway build the
# Next.js frontend instead — but the frontend lives on Vercel, Railway
# only runs the FastAPI backend.
#
# We rely on the Python provider's default behavior: it sees the
# root-level `requirements.txt` (kept in sync with backend/requirements.txt)
# and runs `pip install -r requirements.txt` for us. Start command is
# provided via Procfile.
providers = ["python"]
